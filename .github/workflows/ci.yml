name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests (Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (Zero High/Critical CVEs)
        run: npm audit --audit-level=high

      - name: Run ESLint static code analysis
        run: npm run lint

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run Full Test Suite
        run: npm test

  container-smoke-test:
    name: Docker Build & Container Health Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local test container
        run: docker build -t tuneflow:test .

      - name: Run container & verify healthcheck endpoint
        run: |
          docker run -d --name tuneflow-test -p 3000:3000 tuneflow:test
          sleep 5
          curl --fail http://localhost:3000/api/health || exit 1
          docker rm -f tuneflow-test
