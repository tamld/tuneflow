name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Enforce Single Lockfile Law (RULE-04)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "ERROR: package-lock.json is forbidden by RULE-04. Use pnpm-lock.yaml exclusively."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (Zero High/Critical CVEs)
        run: pnpm audit --audit-level=high

      - name: Run ESLint static code analysis
        run: pnpm run lint

      - name: Run SAST Static Security Gate
        run: node scripts/ci-sast-gate.js

      - name: Run DAST Dynamic Security Gate
        run: node scripts/ci-dast-gate.js

      - name: Verify Governance & Spec-Code Sync Gates
        shell: bash
        run: |
          bash tools/claims_check.sh
          bash tools/ci_spec_code_sync.sh
          bash tools/ci_structure_sync.sh
          bash tools/ci_link_integrity.sh

      - name: Run g8s offer governance gates
        shell: bash
        run: |
          bash tools/ci_spec_code_sync.sh
          bash tools/ci_structure_sync.sh
          bash tools/ci_link_integrity.sh

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run UX & User-Story Visual QA Gate
        run: node scripts/ci-ux-qa-gate.js

      - name: Run Full Test Suite
        run: pnpm test

      - name: Package & Verify Live Windows Installer E2E Gate (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1
          ./scripts/verify_windows_installer_e2e.ps1

  container-smoke-test:
    name: Docker Build & Container Health Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local test container
        run: docker build -t tuneflow:test .

      - name: Run container & verify healthcheck endpoint
        run: |
          docker run -d --name tuneflow-test -p 3000:3000 tuneflow:test
          sleep 5
          curl --fail http://localhost:3000/api/health || exit 1
          curl --fail http://localhost:3000/api/system/doctor || exit 1
          docker rm -f tuneflow-test
