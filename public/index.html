<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneFlow - Nghe Thử & Tải Nhạc Cho Ba Mẹ</title>
  <link rel="stylesheet" href="/css/silver-melody.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E%3Ctext y=%2226%22 font-size=%2226%22>🎶</text></svg>">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🎶</span>
        <div>
          <h1 class="brand-title">TuneFlow</h1>
          <p class="brand-tagline">Nghe thử & Tải nhạc chất lượng cao dành cho Ba Mẹ</p>
        </div>
      </div>
      <button class="help-btn" onclick="alert('Dạ Ba Mẹ chỉ cần:\n1. Chọn hoặc gõ tên bài hát\n2. Bấm nút [Nghe Thử] để nghe trước\n3. Thấy ưng ý thì bấm [Tải Về Máy] là xong ạ!')">
        ❓ Hướng Dẫn Dễ Hiểu
      </button>
    </header>

    <!-- Hero Persona Bar (Mom / Dad / Favorites) -->
    <div class="persona-hero">
      <button id="btn-persona-mom" class="persona-btn active" data-persona="mom">
        <span class="persona-icon">🌸</span>
        <span class="persona-text">Mẹ Hay Nghe</span>
      </button>
      <button id="btn-persona-dad" class="persona-btn" data-persona="dad">
        <span class="persona-icon">☕</span>
        <span class="persona-text">Ba Hay Nghe</span>
      </button>
      <button id="btn-persona-favorites" class="persona-btn" data-persona="favorites">
        <span class="persona-icon">❤️</span>
        <span class="persona-text">Bài Đã Thích (<span id="fav-count">0</span>)</span>
      </button>
    </div>

    <!-- Category Recommendations for Parents -->
    <section class="category-section">
      <div class="category-header-row">
        <h2 class="category-label">📻 Thể loại quen thuộc:</h2>
        <!-- Vocal / Instrumental Filter -->
        <div class="filter-group">
          <button class="filter-chip active" data-filter="all">Tất Cả</button>
          <button class="filter-chip" data-filter="vocal">Có Lời</button>
          <button class="filter-chip" data-filter="instrumental">Không Lời Hòa Tấu</button>
        </div>
      </div>
      <div id="category-pills" class="category-pills">
        <button class="pill-btn" data-query="Nhạc thiền tịnh tâm ngủ ngon">🧘 Nhạc Thiền Thư Giãn</button>
        <button class="pill-btn" data-query="Niệm phật êm dịu thanh tịnh">📿 Niệm Phật Tịnh Tâm</button>
        <button class="pill-btn" data-query="Nhạc spa thư giãn ngủ sâu">🌿 Nhạc Spa Thư Giãn</button>
        <button class="pill-btn" data-query="Dân ca quê hương chọn lọc ngọt ngào">🌾 Dân Ca Quê Hương</button>
      </div>
    </section>

    <!-- Search Section -->
    <section class="search-card">
      <label for="search-input" class="search-label">🔍 Ba Mẹ muốn tìm bài hát hoặc dán link danh sách phát (Playlist) tại đây:</label>
      <div class="search-input-group">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Gõ tên bài hát, ca sĩ, hoặc dán link Playlist YouTube..."
          autocomplete="off"
        >
        <button id="search-btn" class="search-btn">
          🔎 Tìm Kiếm
        </button>
      </div>
    </section>

    <!-- Playlist Batch Ingestion Panel -->
    <section id="playlist-panel" class="playlist-panel" style="display: none;">
      <div class="playlist-panel-header">
        <div>
          <h3 id="playlist-panel-title" class="playlist-panel-title">📻 Danh Sách Phát Tuyển Tập</h3>
          <p id="playlist-panel-meta" class="playlist-panel-meta">Tích chọn các bài ưng ý để tải về máy nhé!</p>
        </div>
        <div class="playlist-panel-actions">
          <button id="btn-select-all" class="btn-panel-secondary">Đánh Dấu Tất Cả</button>
          <button id="btn-download-batch" class="btn-panel-primary">⬇️ Tải Các Bài Đã Chọn (<span id="batch-selected-count">0</span>)</button>
        </div>
      </div>
      <div id="playlist-items-list" class="playlist-items-list"></div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <h2 id="results-header" class="results-header">✨ Bấm chọn một thể loại ở trên hoặc gõ tên bài hát để bắt đầu nhé!</h2>
      <div id="results-grid" class="results-grid"></div>
    </section>
  </div>

  <!-- Sticky Bottom Audio Preview Player -->
  <div id="bottom-player" class="bottom-player">
    <div class="player-inner">
      <button id="btn-player-play-pause" class="btn-play-pause" title="Bật / Dừng nghe thử">
        ▶️
      </button>
      <div class="player-info">
        <div id="player-track-title" class="player-title">Chưa chọn bài hát</div>
        <div id="player-track-status" class="player-status">Bấm nghe thử để bắt đầu</div>
      </div>
      <div class="player-progress-container">
        <span id="player-time-current" class="player-time">00:00</span>
        <input type="range" id="player-progress" class="player-slider" min="0" max="100" value="0">
        <span id="player-time-total" class="player-time">00:00</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
