services:
  tuneflow:
    image: ghcr.io/tamld/tuneflow:latest
    container_name: tuneflow
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MAX_DOWNLOADS=2
      - MAX_CONVERSIONS=1
      - MAX_RETRIES=3
      # Optional YouTube bot challenge bypasses (Issue #23)
      # - YTDLP_PROXY=http://proxy.example.com:8080
      # - YTDLP_EXTRACTOR_ARGS=youtube:player_client=android,web
    volumes:
      - ./downloads:/app/downloads
      # - ./cookies.txt:/app/cookies.txt:ro
    # Resource limits for container host
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 40M
    # Reverse Proxy integration (optional)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tuneflow.rule=Host(`tuneflow.local`)"
      - "traefik.http.entrypoints=web"
      - "traefik.http.services.tuneflow.loadbalancer.server.port=3000"
