schema_version: "verifier-classes.v1"
classes:
  - name: docs
    status: advisory
    priority: 10
    paths:
      - '*.md'
      - 'docs/**'
    checks:
      - type: diff-guard
      - type: script
        run: tools/ci_link_integrity.sh
      - type: script
        run: tools/ci_structure_sync.sh
      - type: script
        run: tools/ci_spec_code_sync.sh
  - name: gates
    status: advisory
    priority: 20
    paths:
      - '**/*'
    checks:
      - type: diff-guard
      - type: script
        run: tools/ci_link_integrity.sh
      - type: script
        run: tools/ci_structure_sync.sh
      - type: script
        run: tools/ci_spec_code_sync.sh
      - type: script
        run: node scripts/ci-sast-gate.js
      - type: script
        run: node scripts/ci-dast-gate.js
